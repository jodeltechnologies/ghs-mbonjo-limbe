<style>
:root{
  --ink:#17201B; --ink-2:#4A544C; --ink-3:#78827A;
  --green:#0B5D33; --green-deep:#063C21; --green-lit:#12854A;
  --gold:#F2C300; --red:#B2202B;
  --paper:#FFFFFF; --surface:#F2F1EC; --surface-2:#E8E7E0;
  --rule:#D6D3C8; --rule-soft:#E6E4DB;
  --ok:#1B6B3A; --warn:#8A6100; --warn-bg:#FBF3DC; --bad:#9C1C26; --bad-bg:#FBEDEE;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --doc:"Tinos","Times New Roman",Times,serif;
  --rail:248px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8E9E4; --ink-2:#AEB5AD; --ink-3:#828A83;
    --green:#3FA06A; --green-deep:#0A2A18; --green-lit:#57BF83;
    --paper:#12160F; --surface:#0D110C; --surface-2:#1A2018;
    --rule:#2C342B; --rule-soft:#222A21;
    --ok:#5FBE84; --warn:#D8B14B; --warn-bg:#2A2413; --bad:#E4808A; --bad-bg:#2C1618;
  }
}
:root[data-theme="dark"]{
  --ink:#E8E9E4; --ink-2:#AEB5AD; --ink-3:#828A83;
  --green:#3FA06A; --green-deep:#0A2A18; --green-lit:#57BF83;
  --paper:#12160F; --surface:#0D110C; --surface-2:#1A2018;
  --rule:#2C342B; --rule-soft:#222A21;
  --ok:#5FBE84; --warn:#D8B14B; --warn-bg:#2A2413; --bad:#E4808A; --bad-bg:#2C1618;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0;letter-spacing:-.008em}
h1{font-size:clamp(1.9rem,4.4vw,3rem)}
h2{font-size:clamp(1.35rem,2.6vw,1.85rem)}
h3{font-size:1.12rem}
p{margin:0 0 1em}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green-lit);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:660px}

/* ---------- masthead : the school's own bilingual government header ---------- */
.masthead{background:var(--paper);border-bottom:3px solid var(--green)}
.mh-grid{display:grid;grid-template-columns:1fr 76px 1fr;gap:14px;align-items:center;
  padding:16px 20px;max-width:1120px;margin:0 auto;text-align:center}
.mh-grid div{font-size:10.5px;line-height:1.42;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.mh-grid div b{display:block;color:var(--ink);font-size:11.5px;letter-spacing:.03em}
.mh-grid div i{display:block;font-style:italic;font-weight:400;font-size:10px}
.mh-shield img{width:76px;height:76px;object-fit:contain;margin:0 auto}
@media(max-width:700px){
  .mh-grid{grid-template-columns:1fr;gap:8px}
  .mh-grid .mh-fr{display:none}
  .mh-shield{order:-1}
}
.navbar{background:var(--green);color:#fff;position:sticky;top:0;z-index:60}
.navbar .wrap{display:flex;align-items:center;gap:6px;min-height:48px;flex-wrap:wrap}
.navbar a{color:#fff;text-decoration:none;padding:11px 11px;font-size:13.5px;font-weight:500;
  border-bottom:3px solid transparent;min-height:44px;display:flex;align-items:center}
.navbar a:hover{background:rgba(255,255,255,.1)}
.navbar a.on{border-bottom-color:var(--gold)}
.navbar .spacer{flex:1}
.navbar .portal-link{background:var(--gold);color:#17201B;font-weight:700;border-radius:3px;
  padding:8px 15px;margin-left:6px;border-bottom:none}
.navtoggle{display:none;background:none;border:1.5px solid rgba(255,255,255,.5);color:#fff;
  border-radius:3px;padding:7px 11px;margin-left:auto;min-height:40px}
@media(max-width:900px){
  .navtoggle{display:block}
  .navlinks{display:none;width:100%;flex-direction:column;padding-bottom:8px}
  .navlinks.open{display:flex}
  .navbar a{width:100%;border-bottom:1px solid rgba(255,255,255,.14)}
  .navbar .portal-link{margin:8px 0 0}
}
.navlinks{display:flex;align-items:center;flex-wrap:wrap}

/* ---------- public ---------- */
.hero{position:relative;background:var(--green-deep)}
.hero img{width:100%;height:clamp(240px,42vw,440px);object-fit:cover;opacity:.55}
.hero-txt{position:absolute;inset:auto 0 0 0;padding:26px 20px;
  background:linear-gradient(transparent,rgba(6,60,33,.86) 55%)}
.hero-txt .wrap{color:#fff}
.hero h1{color:#fff;max-width:16ch}
.motto{font-family:var(--serif);font-style:italic;font-size:clamp(1rem,2vw,1.3rem);color:var(--gold);margin-top:6px}
.section{padding:44px 0;border-top:1px solid var(--rule)}
.section:first-of-type{border-top:none}
.lede{font-family:var(--serif);font-size:1.18rem;line-height:1.6;color:var(--ink-2);max-width:62ch}
.stat-row{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--rule);margin-top:26px}
.stat{flex:1 1 150px;padding:16px 18px 14px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.stat:last-child{border-right:none}
.stat b{display:block;font-family:var(--serif);font-size:2.1rem;line-height:1;color:var(--green)}
.stat span{font-size:12.5px;color:var(--ink-2)}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);
  padding:8px 12px 8px 0;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.ledger td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.ledger tr:hover td{background:var(--surface-2)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:800px){.two{grid-template-columns:1fr;gap:22px}}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:18px}
.eyebrow{font-family:var(--serif);font-style:italic;color:var(--green);font-size:1rem;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;
  padding:10px 17px;border-radius:3px;border:1.5px solid var(--green);background:var(--green);
  color:#fff;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--green-lit);border-color:var(--green-lit)}
.btn.ghost{background:transparent;color:var(--green);}
.btn.ghost:hover{background:var(--surface-2);color:var(--green)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gallery figure{margin:0;border:1px solid var(--rule);background:var(--paper)}
.gallery figcaption{font-size:12.5px;padding:8px 10px;color:var(--ink-2)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;min-height:44px;
  border:1.5px solid var(--rule);border-radius:3px;background:var(--paper)}
.field textarea{min-height:120px;resize:vertical;font-family:var(--sans)}
.note{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:transparent;border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
footer.site{background:var(--green-deep);color:#D9E5DC;padding:34px 0 26px;margin-top:10px}
footer.site a{color:#fff}
footer.site .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:26px}
@media(max-width:760px){footer.site .wrap{grid-template-columns:1fr}}
footer.site h4{color:#fff;font-size:1rem;margin-bottom:8px}
footer.site p,footer.site li{font-size:13.5px}
footer.site ul{list-style:none;padding:0;margin:0}
footer.site li{padding:3px 0}

/* ---------- portal ---------- */
.portal{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--green-deep);color:#CFE0D5;padding:14px 0 90px;position:sticky;top:0;
  height:100vh;overflow-y:auto}
.rail .brand{display:flex;gap:10px;align-items:center;padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.rail .brand img{width:34px;height:34px}
.rail .brand b{color:#fff;font-family:var(--serif);font-size:15px;line-height:1.15;display:block}
.rail .brand span{font-size:11px;color:#9BB6A5}
.rail a{display:flex;align-items:center;gap:9px;padding:10px 16px;color:#CFE0D5;text-decoration:none;
  font-size:14px;min-height:42px;border-left:3px solid transparent}
.rail a:hover{background:rgba(255,255,255,.07);color:#fff}
.rail a.on{background:rgba(255,255,255,.11);color:#fff;border-left-color:var(--gold);font-weight:600}
.rail .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7E9C8B;padding:14px 16px 5px}
.rail .who{padding:12px 16px;border-top:1px solid rgba(255,255,255,.14);margin-top:12px}
.rail .who b{color:#fff;display:block;font-size:13.5px}
.rail .who span{font-size:11.5px;color:#9BB6A5}
.main{padding:22px 26px 80px;max-width:100%;overflow-x:hidden}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;border-bottom:1.5px solid var(--ink);margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;min-height:40px;border:1.5px solid var(--rule);
  border-radius:3px;background:var(--paper)}
.toolbar input[type=search]{min-width:210px;flex:1 1 210px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:0;
  border:1px solid var(--rule);background:var(--paper);margin-bottom:24px}
.tile{padding:15px 16px;border-right:1px solid var(--rule)}
.tile:last-child{border-right:none}
.tile b{display:block;font-family:var(--serif);font-size:1.95rem;line-height:1.05}
.tile span{font-size:12.5px;color:var(--ink-2)}
@media(max-width:640px){.tile{border-bottom:1px solid var(--rule)}}
.rowcards{display:none}
@media(max-width:820px){
  .portal{grid-template-columns:1fr}
  .rail{position:fixed;left:0;right:0;top:auto;bottom:0;height:auto;max-height:62vh;padding:6px 0 8px;
    z-index:70;display:none;border-top:2px solid var(--gold)}
  .rail.open{display:block}
  .main{padding:16px 15px 92px}
  .mobilebar{display:flex!important}
  .desk-table{display:none}
  .rowcards{display:block}
}
.mobilebar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--green-deep);
  z-index:71;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px;align-items:center;
  border-top:1px solid rgba(255,255,255,.18)}
.mobilebar button{flex:1;background:var(--gold);border:none;color:#17201B;font-weight:700;
  border-radius:3px;min-height:44px;cursor:pointer}
.mobilebar .lbl{color:#CFE0D5;font-size:13px;flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowcard{border-bottom:1px solid var(--rule);padding:12px 2px;cursor:pointer;display:block;width:100%;
  text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.rowcard b{display:block;font-size:14.5px}
.rowcard span{font-size:12.5px;color:var(--ink-2)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:80;display:flex;justify-content:flex-end}
.drawer{background:var(--paper);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px 22px 60px;
  border-left:3px solid var(--green)}
.drawer h3{margin-bottom:2px}
.kv{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:0;font-size:13.5px;margin-top:14px}
.kv dt{color:var(--ink-2);padding:7px 10px 7px 0;border-bottom:1px solid var(--rule-soft)}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule-soft);word-break:break-word}
.flag{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);
  padding:9px 12px;font-size:13px;margin-bottom:9px;border-radius:0 3px 3px 0}
.flag.bad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.flag.ok{border-left-color:var(--ok);background:transparent;color:var(--ok);border:1px solid var(--rule);border-left:3px solid var(--ok)}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:8px 0}
.diff>div{background:var(--paper);padding:7px 10px;font-size:13px}
.diff .h{background:var(--surface-2);font-weight:600;font-size:11.5px;color:var(--ink-2)}
.tabs{display:flex;gap:0;border-bottom:1.5px solid var(--ink);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;
  cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap;min-height:44px;margin-bottom:-1.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--green)}
.empty{border:1px dashed var(--rule);padding:26px;text-align:center;color:var(--ink-2);font-size:14px;border-radius:3px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:1.1rem;margin-bottom:4px}

/* ---------- the printed document ----------
   Tightened so that an attestation or a certificate is one A4 sheet with room
   for the stamp, and no acres of white between the lines. Correspondence may
   run to more than one page; the structured documents may not. */
.sheetwrap{background:var(--surface-2);padding:20px;overflow-x:auto;border:1px solid var(--rule)}
.sheet{width:210mm;min-height:297mm;background:#fff;color:#000;margin:0 auto;padding:14mm 16mm;
  font-family:var(--doc);font-size:11.6pt;line-height:1.5;box-shadow:0 1px 5px rgba(0,0,0,.16)}
.sheet.doc{padding:12mm 15mm 10mm;font-size:11pt;line-height:1.34;display:flex;flex-direction:column}
.sheet .lh{display:grid;grid-template-columns:1fr 24mm 1fr;gap:3mm;text-align:center;
  font-size:8.4pt;line-height:1.22}
.sheet .lh b{display:block;font-size:8.8pt}
.sheet .lh span{display:block}
.sheet .lh i{display:block;font-size:7.8pt}
.sheet .lh img{width:22mm;height:22mm;object-fit:contain;margin:0 auto}
.sheet hr{border:none;border-top:1px solid #000;margin:2mm 0}
.sheet .refline{display:flex;justify-content:space-between;font-size:9.4pt;gap:8mm;flex-wrap:wrap}
.sheet .title{text-align:center;margin:6mm 0 5mm}
.sheet .title b{display:block;text-decoration:underline;font-size:12.4pt;letter-spacing:.01em}
.sheet .title i{display:block;font-size:10.2pt}
.sheet .title .yr{display:block;font-size:9.6pt;margin-top:2mm}
.sheet .r{display:grid;grid-template-columns:62mm 1fr;gap:3mm;align-items:baseline;margin-bottom:3.2mm}
.sheet .r .l{font-size:9.8pt}
.sheet .r .l i{display:block;font-size:8.4pt;color:#444}
.sheet .r .v{border-bottom:1px dotted #555;min-height:5mm;font-weight:700;padding-bottom:.6mm}
.sheet .r .v.big{font-size:12pt;letter-spacing:.02em}
.sheet .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5mm;margin-bottom:3.4mm}
.sheet .grid3 .l{display:block;font-size:9.8pt}
.sheet .grid3 .l i{display:block;font-size:8.4pt;color:#444}
.sheet .grid3 .v{display:block;border-bottom:1px dotted #555;min-height:5mm;font-weight:700}
.sheet .test{margin:5mm 0 0;font-size:9.8pt;line-height:1.35}
.sheet .test i{display:block;font-size:8.6pt;color:#333}
.sheet .free{margin-top:4mm;white-space:pre-wrap;font-size:11pt;line-height:1.5;flex:1}
.sheet .sig{margin-top:auto;padding-top:12mm;display:flex;justify-content:flex-end}
.sheet .sig .box{text-align:center;min-width:62mm}
.sheet .sig .pl{font-size:9.6pt;margin-bottom:14mm}
.sheet .sig .rule{border-top:1px solid #000;padding-top:1mm;font-size:9.4pt;line-height:1.3}
.sheet .verify{margin-top:4mm;font-size:7.6pt;color:#666}
@media print{
  body{background:#fff}
  .noprint,.navbar,.masthead,.rail,.mobilebar,footer.site,.page-head,.toolbar,.tabs,.rowcards,
  .drawer-bg,.tiles,.empty,.ctxbar,.quick,.tilegrid,.secttl,.flag{display:none!important}
  .portal{display:block}
  .main{padding:0}
  .sheetwrap{background:none;padding:0;border:none;overflow:visible}
  .sheet{width:auto;min-height:auto;box-shadow:none;padding:11mm 14mm;page-break-after:always}
  .sheet.doc{height:277mm}
  .sheet:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
.printonly{display:none}

/* ---------- update 1.1 ---------- */
.btn{background:linear-gradient(160deg,var(--green-lit),var(--green) 58%,var(--green-deep));
  border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 1px 2px rgba(6,60,33,.28)}
.btn:hover{background:linear-gradient(160deg,#19a35b,var(--green-lit) 60%,var(--green))}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:linear-gradient(170deg,var(--paper),var(--surface-2));color:var(--green);
  border:1.5px solid var(--rule);box-shadow:none}
.btn.ghost:hover{background:linear-gradient(170deg,var(--surface-2),var(--surface));color:var(--green-lit);border-color:var(--green-lit)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-3);box-shadow:none}
.mobilebar button{background:linear-gradient(160deg,#ffe14d,var(--gold) 60%,#d9ae00)}

.ctxbar{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:4px;
  background:linear-gradient(115deg,var(--green-deep),var(--green) 62%,var(--green-lit));
  color:#EAF3ED;padding:2px;margin-bottom:16px;overflow:hidden}
.ctxbar>div{padding:10px 16px;border-right:1px solid rgba(255,255,255,.16);min-width:130px}
.ctxbar>div:last-of-type{border-right:none}
.ctxbar b{display:block;color:#fff;font-family:var(--serif);font-size:1.05rem;line-height:1.15}
.ctxbar span{font-size:11.5px;color:#B9D3C4}
.ctxbar .grow{flex:1}
.ctxsel{align-self:center;margin:0 12px 0 auto;min-height:38px;border-radius:3px;
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:6px 9px}
.ctxsel option{color:var(--ink);background:var(--paper)}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.q{padding:13px 15px;border:1px solid var(--rule);border-radius:4px;
  background:linear-gradient(165deg,var(--paper),var(--surface))}
.q b{display:block;font-family:var(--serif);font-size:1.7rem;line-height:1.05;color:var(--green)}
.q span{font-size:12px;color:var(--ink-2)}

.secttl{font-size:1.15rem;margin:26px 0 10px}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
.tilecard{display:block;padding:15px 15px 17px;border-radius:5px;text-decoration:none;color:#fff;
  border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(20,30,22,.14);min-height:104px}
.tilecard:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(20,30,22,.2)}
.tilecard .ic{font-size:19px;display:block;margin-bottom:6px;filter:saturate(0) brightness(3)}
.tilecard b{display:block;font-family:var(--serif);font-size:1.02rem;line-height:1.2}
.tilecard .sb{display:block;font-size:11.5px;opacity:.86;margin-top:3px;line-height:1.35}
.g1{background:linear-gradient(150deg,#12854A,#063C21)}
.g2{background:linear-gradient(150deg,#2C7A7B,#134E4A)}
.g3{background:linear-gradient(150deg,#1D6FA5,#0C3B5C)}
.g4{background:linear-gradient(150deg,#4C63B6,#26325F)}
.g5{background:linear-gradient(150deg,#7A5AA8,#3B2A55)}
.g6{background:linear-gradient(150deg,#A2478C,#54204A)}
.g7{background:linear-gradient(150deg,#B2202B,#5E1016)}
.g8{background:linear-gradient(150deg,#B4602A,#5C2E12)}
.g9{background:linear-gradient(150deg,#9A7A0E,#4E3D04)}
.g10{background:linear-gradient(150deg,#5C8A1E,#2C450C)}
.g11{background:linear-gradient(150deg,#3F7D5B,#1B3E2B)}
.g12{background:linear-gradient(150deg,#0F8A6E,#054238)}
.g13{background:linear-gradient(150deg,#5E6B75,#2B333A)}
.g14{background:linear-gradient(150deg,#1D7A8C,#0A3A43)}
.g15{background:linear-gradient(150deg,#6B5540,#33281D)}
.g16{background:linear-gradient(150deg,#8A4B2A,#452312)}
.g17{background:linear-gradient(150deg,#2F6F4E,#153524)}
.g18{background:linear-gradient(150deg,#455A64,#1F2A30)}
.g19{background:linear-gradient(150deg,#4A5568,#232A35)}
.g20{background:linear-gradient(150deg,#6D4C7D,#33223B)}

.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:40px;padding:0 4px}
.chk input{width:19px;height:19px}
.bad-t{color:var(--bad)}
.ledger tr.tot td{border-top:1.5px solid var(--ink);font-weight:700;background:var(--surface-2)}
.ledger tr.voided td{opacity:.5;text-decoration:line-through}

.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.phcell{text-align:center;padding:9px;border:1px solid var(--rule);border-radius:4px;
  background:linear-gradient(170deg,var(--paper),var(--surface))}
.phcell img{width:110px;height:110px;object-fit:cover;border-radius:3px;margin:0 auto;border:1px solid var(--rule)}
.phcell select{width:100%;margin-top:5px;font-size:11.5px;padding:4px;border:1px solid var(--rule);
  border-radius:3px;background:var(--paper)}
.facegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.facegrid figure{margin:0;text-align:center}
.facegrid img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--rule);border-radius:4px}
.facegrid figcaption{font-size:12px;margin-top:6px;line-height:1.35;color:var(--ink-2)}
.facegrid figcaption b{color:var(--ink)}

/* the report card, laid out as the school prints it */
.sheet.report{font-size:9.4pt;line-height:1.28;padding:9mm 10mm}
.rc-head{width:100%;border-collapse:collapse;font-size:7.9pt;line-height:1.28}
.rc-head td{border:1px solid #000;padding:1mm 2mm;text-align:center;vertical-align:middle;width:38%}
.rc-head td.mid{width:24%;border:none}
.rc-head td.mid img{width:17mm;height:17mm;object-fit:contain;margin:0 auto}
.rc-head .b{font-weight:700}
.rc-head .i{font-style:italic;font-size:7.2pt}
.rc-title{text-align:center;font-weight:700;font-size:13pt;margin:3mm 0 1mm}
.rc-title .sub{font-size:9pt;font-weight:700}
.rc-photo{width:26mm;height:30mm;border:1px solid #000;margin:0 auto 2mm;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.rc-photo img{width:100%;height:100%;object-fit:cover}
.rc-photo span{font-size:6.6pt;color:#888;text-align:center}
.rc-info{width:100%;border-collapse:collapse;font-size:8.6pt;margin-bottom:2mm}
.rc-info td{border:1px solid #000;padding:1mm 2mm;width:50%}
.rc-marks{width:100%;border-collapse:collapse;font-size:8.2pt}
.rc-marks th,.rc-marks td{border:1px solid #000;padding:0.7mm 1mm;text-align:center}
.rc-marks th{font-weight:700;font-size:7.8pt}
.rc-marks .tch{display:block;font-size:6.2pt;font-weight:400;letter-spacing:.01em}
.rc-marks tr.low td{color:#C00}
.rc-marks tr.tot td{font-weight:700}
.rc-foot{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:3mm;font-size:8.2pt}
.rc-foot .hl{font-weight:700;margin-bottom:1mm}
.rc-foot .hl.c{text-align:center}
.rc-box{width:100%;border-collapse:collapse}
.rc-box td,.rc-box th{border:1px solid #000;padding:0.8mm 1.5mm}
.rc-box td:last-child{width:26%;text-align:center;font-weight:700}
.rc-box.key td:last-child{width:auto;text-align:left;font-weight:400;font-size:7.2pt}
.rc-box .low{color:#C00}
.rc-remark{border:1px solid #000;padding:2mm;margin-top:3mm;font-size:8.4pt}
.rc-sign{width:100%;border-collapse:collapse;font-size:8pt;margin-top:1mm}
.rc-sign td{border:1px solid #000;height:20mm;vertical-align:top;padding:1mm;text-align:center;width:25%}
.sheet.receipt{min-height:150mm}
@media print{.sheet.report{page-break-after:always}}
</style>
</head>
